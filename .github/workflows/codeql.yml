name: CodeQL

on:
  pull_request:
  push:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          build-mode: manual

      - name: Configure Windows CLI build
        run: cmake -S . -B build -A x64 -DNOXMQTT_BUILD_CLI_APP=ON

      - name: Build Windows CLI
        run: cmake --build build --config Debug

      - name: Analyze
        uses: github/codeql-action/analyze@v4
