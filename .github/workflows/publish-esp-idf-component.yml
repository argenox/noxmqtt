name: Publish ESP-IDF Component

on:
  push:
    tags:
      - "v*"
      - "*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish argenox/noxmqtt
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Upload component
        uses: espressif/upload-components-ci-action@v2
        with:
          components: "noxmqtt: ."
          namespace: "argenox"
